name: Update streak stats

on:
  schedule:
    - cron: "0 8 * * *" # 03:00 US Central
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@v1.7.0
        with:
          options: user=${{ github.repository_owner }}&background=07130B&border=238636&stroke=163D22&ring=7EE787&fire=7EE787&currStreakNum=F0F6FC&sideNums=7EE787&currStreakLabel=F0F6FC&sideLabels=7EE787&dates=B1BAC4&border_radius=18&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "Update streak stats" || exit 0
          git push
